name: samtools_consensus
description: |
  Build a consensus sequence for each reference contig from a coordinate-sorted BAM.
keywords:
  - consensus
  - fasta
  - bam
  - samtools
tools:
  - samtools:
      description: |
        samtools

input:
  - bam:
      type: map/file
      description: |
        Sample metadata map and a coordinate-sorted BAM.
      pattern: "tuple val(meta), path(bam)"

output:
  - fasta:
      type: map/file
      description: |
        Consensus sequences, one record per reference contig with coverage.
      pattern: "tuple val(meta), path(*.consensus.fa)"

authors:
  - "EIT Generative Biology Institute"
