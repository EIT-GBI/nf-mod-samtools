name: samtools_filter
description: |
  Filter reads by a samtools expression. Intended mainly for long-read data, keeping MM/ML modified-base tags intact.
keywords:
  - filter
  - bam
  - quality
  - samtools
tools:
  - samtools:
      description: |
        samtools

params:
  - filter.min_read_quality:
      type: integer
      description: |
        Minimum mean base quality; becomes `avg(qual) >= <value>` in the samtools
        filter expression. Omit to drop this term.
  - filter.min_read_length:
      type: integer
      description: |
        Minimum read length; becomes `length(seq) >= <value>` in the samtools
        filter expression. Omit to drop this term.

input:
  - bam:
      type: map/file
      description: |
        Sample metadata map and a BAM.
      pattern: "tuple val(meta), path(bam)"

output:
  - filtered:
      type: map/file
      description: |
        Filtered BAM and its index.
      pattern: "tuple val(meta), path(*.filtered.bam), path(*.filtered.bam.bai)"

authors:
  - "EIT Generative Biology Institute"
